modelRoles:
  advisor: openai-codex/gpt-6.1-sol:high
  commit: openai-codex/gpt-6-luna:xhigh
  slow: openai-codex/gpt-6.1-sol:xhigh
  smol: openai-codex/gpt-6-luna:max
  default: openai-codex/gpt-6.1-sol:medium
symbolPreset: nerd
composer:
  shape: field
  tokenRate: true
theme:
  dark: carbonfox-transparent
  light: light
setupVersion: 2
statusLine:
  separator: powerline-thin
  transparent: false
  preset: default
tui:
  textSizing: true
  reactions: false
  mouse: false
  tight: true
terminal:
  showProgress: false
display:
