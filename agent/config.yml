  - skill:find-skills
  - skill:orca-cli
retry:
  modelFallback: false
disabledProviders:
  - claude
  - agent-plugins
  - claude-plugins
  - agents
  - codex
  - gemini
  - opencode
  - cursor
  - windsurf
  - cline
  - github
  - vscode
  - claude-md
  - custom-context
  - mcp-json
  - ssh-json
skills:
  customDirectories:
    - ~/.agents/skills
dev:
  autoqaConsent: granted
recap:
  enabled: false